# --- the machines: a 909-style kit, straight and locked ---

# Four to the floor, with a push on the last eighth of every fourth bar.
[voices.kick]
grid = "X . . . X . . . X . . . X . . . | X . . . X . . . X . . . X . . . | X . . . X . . . X . . . X . . . | X . . . X . . . X . . . X . x ."
sound = { role = "kick", words = ["909"] }

[voices.kick.mix]
highpass = 28

[voices.clap]
grid = ". . . . x . . . . . . . x . . ."
sound = { role = "clap", words = ["909"] }

[voices.clap.mix]
highpass = 180
level = -2
send = { hall = -16 }

# Closed hats on the sixteenths around the open hats, which they choke.
[voices.chh]
grid = "x x . x x x . x x x . x x x . x"
sound = { role = "hat", words = ["909"] }
chokes = ["ohh"]

[voices.chh.mix]
highpass = 350
pan = 0.15
level = -4

[voices.ohh]
grid = ". . o . . . o . . . o . . . o ."
sound = { role = "hat_open", words = ["909"] }

[voices.ohh.mix]
highpass = 400
pan = -0.15
level = -4
send = { hall = -22 }

# The ride on the eighths, a 909's washy one, synthesised as a long hat.
[voices.ride]
grid = "x . X . x . X . x . X . x . X ."
sound = { role = "ride", synth = "mph_hat" }
params = { decay = 0.3 }
seconds = 0.24
gain_db = -6

[voices.ride.mix]
highpass = 500
pan = 0.3
level = -4
send = { hall = -18 }

# A syncopated two-bar figure, into the echo in the dubs.
[voices.rim]
grid = ". . . x . . x . . . . x . . x . | . x . . . . x . . . x . . . . ."
sound = { role = "rim", words = ["909"] }

[voices.rim.mix]
highpass = 300
pan = -0.3
level = -5
send = { echo = -16 }

[voices.rim.automate]
echo = [[1, -16], [137, -16], [137, -6], [153, -6], [153, -16], [241, -16], [241, -6], [257, -6], [257, -16]]

# --- the skins and the iron: West African drums on a triplet grid ---

# The standard bell pattern, seven strokes in twelve pulses (BM-AFRO-01).
[voices.bell]
grid = "X . x . x x . x . x . x"
sound = { role = "bell" }
gain_db = -3

[voices.bell.mix]
highpass = 400
pan = 0.25
level = -3
send = { hall = -18 }

[voices.shaker]
grid = "X x x X x x X x x X x x"
sound = { role = "shaker" }
humanise = 0.08
