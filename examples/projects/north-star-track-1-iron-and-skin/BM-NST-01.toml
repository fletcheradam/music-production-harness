  { name = "Two clocks", bars = [65, 72], play = ["bell", "shaker", "tone", "slap", "dunun", "strings"] },
  { name = "Groove B", bars = [73, 104], play = ["kick", "clap", "chh", "ohh", "ride", "rim", "bell", "shaker", "tone", "slap", "dunun", "bass", "stabs", "throw"] },
