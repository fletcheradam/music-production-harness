# spec/tracks/north-star.md#bm-nst-01: Iron and Skin, the whole track.
# Instrumental: no voice, vocoder or synthetic voice anywhere (Adam, 2026-11-23).
# Every part is a SuperCollider synth, so it renders on a fresh install.
id = "BM-NST-01"
title = "Iron and Skin, the whole track"
hear = "a Detroit techno track where two clocks run at once. A dry 909 four opens it, and the iron bell's lopsided seven strokes arrive over it, then the djembe and dunun, leaning in the long-short-short jembe feel while the kick stays locked. Parallel minor ninth stabs hang over a rolling bass, with every fourth bar's last stab thrown into the echo. The Jersey sections swap the bass for a round, honking organ bass and open up the strings. The dubs strip back to kick, rim, ride and echoes, the breaks leave the African ensemble on its own, an acid line takes the second peak, and the track winds down to kick and hats for the next DJ. No voices at all."
project = "North star track 1: Iron and Skin"
bpm = 122
bars = 392
swing = 0.54
feel = [41, 31, 28]
seed = 23
rate = 48000
measure = ["chords", "mono-low"]

sections = [
