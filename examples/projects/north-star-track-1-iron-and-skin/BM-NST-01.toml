# --- the mix ---

# A dub echo on a dotted eighth, alternating left and right, into the hall.
[sends.echo]
kind = "delay"
beats = 0.75
feedback = 0.45
lowpass = 2800
pingpong = true
highpass = 300
level = -3
send = { hall = -10 }

[sends.hall]
kind = "reverb"
decay_s = 3.0
damping = 6000
predelay_ms = 25
highpass = 250
level = -6

[master]
highpass = 25

# The kick ducks the parts that hold under it.
[sidechain]
trigger = "kick"
targets = ["bass", "organ", "strings", "acid"]
depth_db = 18.0
attack_ms = 2.0
release_ms = 380.0
